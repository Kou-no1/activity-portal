/* YouTube URL → 埋め込みID抽出 */
const ytId=url=>{
  if(!url)return null;
  const m=String(url).match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  return m?m[1]:null;
};

/* ══════════ フィルターチップ ══════════ */
function FilterGroup({label,options,selected,onToggle,color}){
  return(
    <div style={{marginBottom:10}}>
      <div style={{fontSize:11,fontWeight:'800',color:'#9CA3AF',marginBottom:5}}>{label}</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
        {options.map(o=>{
          const on=selected.includes(o);
          return(
            <button key={o} className="chip" onClick={()=>onToggle(o)}
              style={{padding:'5px 12px',borderRadius:16,fontSize:12,fontWeight:'800',
                background:on?color:'#fff',color:on?'#fff':'#6B7280',
                border:on?`2px solid ${color}`:'2px solid #E5E7EB'}}>
              {o}
            </button>
          );
        })}
      </div>
    </div>
  );
}

          <ol style={{paddingLeft:0,listStyle:'none',marginBottom:20}}>
            {(act.steps||[]).map((s,i)=>(
              <li key={i} style={{display:'flex',gap:10,marginBottom:7,alignItems:'flex-start'}}>
                <span style={{flexShrink:0,width:22,height:22,borderRadius:'50%',background:cat.color,color:'#fff',fontSize:11,fontWeight:'900',display:'flex',alignItems:'center',justifyContent:'center',marginTop:1}}>{i+1}</span>
                <span style={{fontSize:13.5,lineHeight:1.7,color:'#374151',fontWeight:'500'}}>{s}</span>
              </li>
            ))}
          </ol>

          {/* ふりかえり */}
          <h3 style={{fontSize:13,fontWeight:'900',color:'#374151',marginBottom:8}}>💭 ふりかえりの問い</h3>
          <div style={{background:'#FFFBEB',borderRadius:14,padding:'13px 16px',marginBottom:20,border:'1.5px solid #FDE68A'}}>
            {(act.reflection||[]).map((r,i)=>(
              <div key={i} style={{fontSize:13,lineHeight:1.75,color:'#78350F',fontWeight:'600',marginBottom:i<(act.reflection.length-1)?6:0}}>
                ・{r}
              </div>
            ))}
          </div>

          {/* 指導のポイント */}
          {act.tips&&(<>
            <h3 style={{fontSize:13,fontWeight:'900',color:'#374151',marginBottom:8}}>💡 指導のポイント</h3>
            <div style={{background:'#F0F9FF',borderRadius:14,padding:'13px 16px',marginBottom:20,border:'1.5px solid #BAE6FD',fontSize:12.5,lineHeight:1.8,color:'#075985',fontWeight:'600'}}>
              {act.tips}
            </div>
          </>)}

          {/* ねらいタグ */}
          <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:18}}>
            {(act.aims||[]).map(a=>(
              <span key={a} style={{padding:'4px 11px',borderRadius:12,background:`${cat.color}18`,color:cat.color,fontSize:11,fontWeight:'800'}}>#{a}</span>
            ))}
          </div>

          {/* アクション */}
          <div className="no-print" style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button onClick={()=>onToggleDone(act.id)}
              style={{flex:1,minWidth:130,padding:'11px',borderRadius:14,background:isDone?'#10B981':'#F3F4F6',color:isDone?'#fff':'#6B7280',fontSize:13,fontWeight:'900'}}>
              {isDone?'✅ 実施済み':'□ 実施したら記録'}
            </button>
            <button onClick={()=>window.print()} style={{padding:'11px 20px',borderRadius:14,background:'#EFF6FF',color:'#2563EB',fontSize:13,fontWeight:'900'}}>🖨 印刷</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════ メインアプリ ══════════ */
function App(){
  const[acts,setActs]=useState(FALLBACK_ACTIVITIES);
  const[loading,setLoading]=useState(!!GAS_URL);
  const[loadErr,setLoadErr]=useState('');
  const[cat,setCat]=useState('ALL');
  const[q,setQ]=useState('');
  const[fAims,setFAims]=useState([]);
  const[fSizes,setFSizes]=useState([]);
  const[fPlaces,setFPlaces]=useState([]);
  const[fSeasons,setFSeasons]=useState([]);
  const[fDur,setFDur]=useState(null);
  const[showFilter,setShowFilter]=useState(false);
  const[detail,setDetail]=useState(null);
  const[done,setDone]=useState([]);

  /* GASからデータ取得 */
  useEffect(()=>{
    if(!GAS_URL)return;
    fetch(GAS_URL).then(r=>r.json()).then(d=>{
      if(Array.isArray(d)&&d.length)setActs(d);
      setLoading(false);
    }).catch(e=>{setLoadErr('データ取得に失敗。組み込みデータを表示します');setLoading(false)});
  },[]);

  /* 実施済み記録の復元 */
  useEffect(()=>{
    try{const s=localStorage.getItem('actDone_v1');if(s)setDone(JSON.parse(s))}catch(e){}
  },[]);
  const toggleDone=useCallback(id=>{
    setDone(prev=>{
      const next=prev.includes(id)?prev.filter(x=>x!==id):[...prev,id];
      try{localStorage.setItem('actDone_v1',JSON.stringify(next))}catch(e){}
      return next;
    });
  },[]);

  const toggle=(arr,setArr)=>v=>setArr(p=>p.includes(v)?p.filter(x=>x!==v):[...p,v]);

  /* 今月に応じたおすすめ時期 */
  const currentSeason=useMemo(()=>{
    const m=new Date().getMonth()+1;
    if(m===4||m===5)return '4月出会い';
    if(m===2||m===3)return '学年末';
    if(m===9||m===10)return '行事前';
    return '学期途中';
  },[]);

  const filtered=useMemo(()=>{
    return acts.filter(a=>{
      if(cat!=='ALL'&&a.category!==cat)return false;
      if(q){
        const t=(a.title+a.catchphrase+(a.aims||[]).join()+(a.tips||'')).toLowerCase();
        if(!t.includes(q.toLowerCase()))return false;
      }
      if(fDur!==null&&a.duration>fDur)return false;
      if(fAims.length&&!fAims.some(x=>(a.aims||[]).includes(x)))return false;
      if(fSizes.length&&!fSizes.some(x=>(a.groupSize||[]).includes(x)))return false;
      if(fPlaces.length&&!fPlaces.some(x=>(a.place||[]).includes(x)))return false;
      if(fSeasons.length&&!fSeasons.some(x=>(a.season||[]).includes(x)))return false;
      return true;
    });
  },[acts,cat,q,fDur,fAims,fSizes,fPlaces,fSeasons]);

  const activeFilters=fAims.length+fSizes.length+fPlaces.length+fSeasons.length+(fDur!==null?1:0);
  const clearAll=()=>{setFAims([]);setFSizes([]);setFPlaces([]);setFSeasons([]);setFDur(null);setQ('')};

  return(
    <div style={{maxWidth:1080,margin:'0 auto',padding:'20px 14px 60px'}}>

      {/* ヘッダー */}
      <div className="no-print" style={{textAlign:'center',marginBottom:20}}>
        <div style={{fontSize:38,marginBottom:2}}>🤝</div>
        <h1 style={{fontSize:'clamp(21px,4.4vw,30px)',fontWeight:'900',color:'#1F2937'}}>学級づくりアクティビティ集</h1>
        <p style={{fontSize:12.5,color:'#9CA3AF',marginTop:4,fontWeight:'700'}}>PA・SGE・SST を「時間」「人数」「ねらい」から探せる</p>
        {loadErr&&<div style={{marginTop:8,fontSize:11,color:'#F59E0B',fontWeight:'700'}}>⚠ {loadErr}</div>}
      </div>

      {/* 検索バー */}
      <div className="no-print" style={{background:'#fff',borderRadius:18,padding:'14px 16px',boxShadow:'0 2px 14px rgba(0,0,0,0.06)',marginBottom:14}}>
        <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 キーワードで探す（例：アイスブレイク）"
            style={{flex:1,minWidth:180,padding:'9px 14px',borderRadius:13,border:'2px solid #E5E7EB',fontSize:13,outline:'none'}}/>
          <button onClick={()=>setShowFilter(f=>!f)}
            style={{padding:'9px 16px',borderRadius:13,background:activeFilters?'#6366F1':'#F3F4F6',color:activeFilters?'#fff':'#6B7280',fontSize:13,fontWeight:'800',whiteSpace:'nowrap'}}>
            ⚙ 絞り込み{activeFilters>0&&` (${activeFilters})`}
          </button>
        </div>

        {/* 時間クイック */}
        <div style={{display:'flex',gap:5,flexWrap:'wrap',alignItems:'center'}}>
          <span style={{fontSize:11,fontWeight:'800',color:'#9CA3AF'}}>⏱</span>
          {DURATIONS.map(d=>(
            <button key={d.label} className="chip" onClick={()=>setFDur(fDur===d.max?null:d.max)}
              style={{padding:'5px 12px',borderRadius:16,fontSize:12,fontWeight:'800',
                background:fDur===d.max?'#6366F1':'#fff',color:fDur===d.max?'#fff':'#6B7280',
                border:fDur===d.max?'2px solid #6366F1':'2px solid #E5E7EB'}}>{d.label}</button>
          ))}
          {activeFilters>0&&<button onClick={clearAll} style={{marginLeft:'auto',fontSize:11,color:'#EF4444',fontWeight:'800',background:'none'}}>× クリア</button>}
        </div>

        {/* 詳細フィルタ */}
        {showFilter&&(
          <div className="fade-up" style={{marginTop:14,paddingTop:14,borderTop:'1.5px solid #F3F4F6'}}>
            <FilterGroup label="🎯 ねらい" options={ALL_AIMS} selected={fAims} onToggle={toggle(fAims,setFAims)} color="#8B5CF6"/>
            <FilterGroup label="👥 人数" options={ALL_SIZES} selected={fSizes} onToggle={toggle(fSizes,setFSizes)} color="#F59E0B"/>
            <FilterGroup label="📍 場所" options={ALL_PLACES} selected={fPlaces} onToggle={toggle(fPlaces,setFPlaces)} color="#10B981"/>
            <FilterGroup label="📅 時期" options={ALL_SEASONS} selected={fSeasons} onToggle={toggle(fSeasons,setFSeasons)} color="#EC4899"/>
          </div>
        )}
      </div>

      {/* カテゴリタブ */}
      <div className="no-print" style={{display:'flex',gap:7,marginBottom:16,flexWrap:'wrap'}}>
        <button onClick={()=>setCat('ALL')}
          style={{padding:'9px 18px',borderRadius:14,fontSize:13,fontWeight:'900',
            background:cat==='ALL'?'#374151':'#fff',color:cat==='ALL'?'#fff':'#6B7280',
            boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}>
          すべて ({acts.length})
        </button>
        {Object.entries(CATEGORIES).map(([k,c])=>(
          <button key={k} onClick={()=>setCat(k)}
            style={{padding:'9px 18px',borderRadius:14,fontSize:13,fontWeight:'900',
              background:cat===k?c.color:'#fff',color:cat===k?'#fff':c.color,
              boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}>
            {c.emoji} {c.label} ({acts.filter(a=>a.category===k).length})
          </button>
        ))}
      </div>

      {/* カテゴリ説明 */}
      {cat!=='ALL'&&(
        <div className="fade-up no-print" style={{background:CATEGORIES[cat].bg,borderRadius:14,padding:'11px 16px',marginBottom:14,fontSize:12.5,fontWeight:'700',color:'#4B5563'}}>
          <b style={{color:CATEGORIES[cat].color}}>{CATEGORIES[cat].full}</b> — {CATEGORIES[cat].desc}
        </div>
      )}

      {/* 件数 */}
      <div className="no-print" style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,padding:'0 2px'}}>
        <span style={{fontSize:12,color:'#9CA3AF',fontWeight:'800'}}>{filtered.length}件</span>
        <span style={{fontSize:11,color:'#C4B5FD',fontWeight:'800'}}>💡 今の時期のおすすめ：{currentSeason}</span>
      </div>

      {/* カードグリッド */}
      <div className="no-print" style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(232px,1fr))',gap:12}}>
        {filtered.map((a,i)=>{
          const c=CATEGORIES[a.category]||CATEGORIES.PA;
          const isDone=done.includes(a.id);
          const hasVid=(a.videos||[]).some(v=>v&&v.url);
          const isRec=(a.season||[]).includes(currentSeason);
          return(
            <div key={a.id} className="card fade-up" onClick={()=>setDetail(a)}
              style={{background:'#fff',borderRadius:16,padding:'14px 15px',cursor:'pointer',
                boxShadow:'0 2px 12px rgba(0,0,0,0.07)',border:`2px solid ${isDone?'#10B98155':'transparent'}`,
                animationDelay:`${Math.min(i*0.02,0.3)}s`,position:'relative',overflow:'hidden'}}>
              {isDone&&<div style={{position:'absolute',top:9,right:10,fontSize:14}}>✅</div>}
              {isRec&&!isDone&&<div style={{position:'absolute',top:0,right:0,background:'#FBBF24',color:'#fff',fontSize:9,fontWeight:'900',padding:'2px 9px',borderRadius:'0 14px 0 10px'}}>今おすすめ</div>}
              <span style={{display:'inline-block',padding:'2px 9px',borderRadius:10,background:c.bg,color:c.color,fontSize:10,fontWeight:'900',marginBottom:7}}>
                {c.emoji} {c.label}
              </span>
              <h3 style={{fontSize:15.5,fontWeight:'900',color:'#1F2937',lineHeight:1.3,marginBottom:5}}>{a.title}</h3>
              <p style={{fontSize:11.5,color:'#9CA3AF',lineHeight:1.55,fontWeight:'600',marginBottom:10,minHeight:36}}>{a.catchphrase}</p>
              <div style={{display:'flex',gap:5,flexWrap:'wrap',alignItems:'center'}}>
                <span style={{padding:'3px 9px',borderRadius:10,background:'#F3F4F6',fontSize:10.5,fontWeight:'800',color:'#6B7280'}}>⏱{a.duration}分</span>
                <span style={{padding:'3px 9px',borderRadius:10,background:'#F3F4F6',fontSize:10.5,fontWeight:'800',color:'#6B7280'}}>👥{(a.groupSize||[])[0]}</span>
                {hasVid&&<span style={{padding:'3px 9px',borderRadius:10,background:'#FEE2E2',fontSize:10.5,fontWeight:'800',color:'#DC2626'}}>🎥</span>}
              </div>
            </div>
          );
        })}
      </div>

      {filtered.length===0&&(
        <div className="no-print" style={{textAlign:'center',padding:'50px 20px',color:'#D1D5DB'}}>
          <div style={{fontSize:40,marginBottom:8}}>🔍</div>
          <p style={{fontSize:14,fontWeight:'800'}}>条件に合う活動がありません</p>
          <button onClick={clearAll} style={{marginTop:12,padding:'8px 20px',borderRadius:12,background:'#F3F4F6',color:'#6B7280',fontSize:12,fontWeight:'800'}}>条件をクリア</button>
        </div>
      )}

      {/* 実施済みサマリー */}
      {done.length>0&&(
        <div className="no-print" style={{marginTop:24,padding:'13px 17px',borderRadius:15,background:'#F0FDF4',border:'1.5px solid #BBF7D0',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
          <span style={{fontSize:12.5,fontWeight:'800',color:'#166534'}}>✅ 実施した活動：{done.length} / {acts.length} 件</span>
          <button onClick={()=>{if(confirm('実施記録をすべて消しますか？')){setDone([]);try{localStorage.removeItem('actDone_v1')}catch(e){}}}}
            style={{fontSize:11,color:'#16A34A',fontWeight:'800',background:'none'}}>記録をリセット</button>
        </div>
      )}

      <div className="no-print" style={{textAlign:'center',marginTop:34,fontSize:11,color:'#D1D5DB',fontWeight:'700'}}>
        「あったらいいのに」を、作ってる。
      </div>

      {detail&&<DetailModal act={detail} onClose={()=>setDetail(null)} onToggleDone={toggleDone} isDone={done.includes(detail.id)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
